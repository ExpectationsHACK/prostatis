<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>You're offline · Prostatis</title>
<style>
  :root { --paper:#faf8f4; --card:#fff; --ink:#151515; --muted:#5f5b53; --brand:#eb5e28; --wash:#fdeee6; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px; background:var(--paper); color:var(--ink); font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { width:100%; max-width:440px; background:var(--card); border:2px solid var(--ink); border-radius:16px; box-shadow:4px 4px 0 var(--ink); padding:28px 24px; text-align:center; }
  .icon { width:72px; height:72px; margin:0 auto; display:grid; place-items:center; border:2px solid var(--ink); border-radius:20px; background:var(--wash); box-shadow:3px 3px 0 var(--ink); }
  h1 { margin:20px 0 8px; font-size:26px; line-height:1.15; letter-spacing:-0.02em; }
  p { margin:0; color:var(--muted); }
  button { margin-top:22px; height:46px; padding:0 22px; border:2px solid var(--ink); border-radius:12px; background:var(--brand); color:var(--ink); font:600 15px system-ui,sans-serif; box-shadow:3px 3px 0 var(--ink); cursor:pointer; }
  .status { margin-top:16px; font-size:13px; }
  @media (prefers-reduced-motion: no-preference) { .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--brand); margin-right:6px; animation:pulse 1.4s infinite; } }
  @keyframes pulse { 50% { opacity:.25 } }
</style>
</head>
<body>
<main>
  <div class="icon" aria-hidden="true">
    <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#b8400f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h.01"/><path d="M8.5 16.43a5 5 0 0 1 7 0"/><path d="M5 12.86a10 10 0 0 1 5.17-2.69"/><path d="M19 12.86a10 10 0 0 0-2-1.54"/><path d="M2 8.82a15 15 0 0 1 4.17-2.65"/><path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76"/><path d="m2 2 20 20"/></svg>
  </div>
  <h1>You're offline</h1>
  <p>This page needs the internet to load. Check your data or Wi-Fi. Your progress and any payment you made are safe: nothing is lost.</p>
  <button type="button" onclick="location.reload()">Try again</button>
  <p class="status" role="status"><span class="dot" aria-hidden="true"></span>This page will reload by itself when you're back online.</p>
</main>
<script>
  // Back online: reload the address the visitor was trying to open (this page is served in its place).
  addEventListener("online", function () { location.reload(); });
  setInterval(function () { if (navigator.onLine) location.reload(); }, 15000);
</script>
</body>
</html>
