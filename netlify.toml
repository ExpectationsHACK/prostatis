# Netlify hosting. Netlify detects Next.js and builds it with its OpenNext adapter
# automatically (server pages and actions become Netlify Functions, src/proxy.ts an Edge
# Function), so there is no plugin to install or pin. Environment variables are set in the
# Netlify dashboard, never here. See "Deploying to Netlify" in README.md.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Next.js 16 and Sentry need Node 20.19+.
  NODE_VERSION = "22"
  # Telemetry off in the build logs.
  NEXT_TELEMETRY_DISABLED = "1"
  # NEXT_PUBLIC_* values are public by design (Next.js puts them into the pages), so Netlify's
  # secret scanner must not fail the build when it finds them there. Real secrets are still scanned.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SITE_URL,NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY,NEXT_PUBLIC_WHATSAPP_INVITE_URL,NEXT_PUBLIC_CONTACT_EMAIL,NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN,NEXT_PUBLIC_POSTHOG_HOST,NEXT_PUBLIC_SENTRY_DSN"
